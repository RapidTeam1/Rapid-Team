<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0c0d">
<script>try{var t=localStorage.getItem("rt-tema");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rapid Team">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icona-180.png"><link rel="icon" href="icona-192.png">
<title>Giro commerciale RAPID</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: strumento di lavoro, asciutto, da usare in macchina con una mano.
   IDEA: il foglio di marcia del tecnico RAPID, nello stile del cruscotto: testata nera con le onde,
   in evidenza la prossima visita, poi la giornata come una linea del tempo.
   COLOUR and TYPE: nero e rosso RAPID (colori dell'amministratore via RT.colori); Archivo largo come il logo.
   Colori senza light-dark() per funzionare anche su telefoni con browser non aggiornati. */
:root{color-scheme:light dark;--bg:#fff;--ink:#111214;--mut:#62646b;--line:#e4e4e7;--card:#f4f4f5;--red:#e41519;--ok:#1d8a4b;--okbg:#e9f6ee;--or:#c2410c;--wa:#b45309;--blk:#0c0c0d;--sh:0 14px 40px rgba(0,0,0,.14)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101012;--ink:#f2f2f3;--mut:#a3a4ab;--line:#2a2a2f;--card:#1a1a1e;--ok:#34c26f;--okbg:#0f2418;--or:#fb923c;--wa:#fbbf24;--sh:0 14px 40px rgba(0,0,0,.45)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#101012;--ink:#f2f2f3;--mut:#a3a4ab;--line:#2a2a2f;--card:#1a1a1e;--ok:#34c26f;--okbg:#0f2418;--or:#fb923c;--wa:#fbbf24;--sh:0 14px 40px rgba(0,0,0,.45)}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.w{font-stretch:125%;font-variation-settings:"wdth" 125}
.wrap{max-width:900px;margin:0 auto;padding-left:max(4vw,16px);padding-right:max(4vw,16px)}

/* ---------- apertura (stesso stile dell'accesso) ---------- */
#lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px 20px;color:#fff;background:radial-gradient(120% 70% at 100% 0%,rgba(228,21,25,.2),transparent 60%),var(--blk)}
#lock form{width:min(400px,100%);display:grid;gap:16px}
#lock img{width:min(210px,64%);height:auto;margin:0 0 8px}
#lock h1{margin:0;font-size:clamp(32px,8vw,42px);line-height:1;font-weight:800}
#lock p{margin:0;color:#b9bac0;font-size:15px}
#pw{width:100%;padding:16px 18px;border-radius:14px;border:1.5px solid #2c2d33;background:#141417;color:#fff;font-size:20px;letter-spacing:.2em;text-align:center}
#pw:focus{border-color:var(--red);outline:0}
#lb,#lock .acc{display:flex;align-items:center;justify-content:center;min-height:56px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none;box-shadow:0 10px 30px rgba(228,21,25,.28)}
#lb:disabled{opacity:.6}
#err{color:#ff8a8a;min-height:21px}
.spin{display:flex;align-items:center;gap:12px}
.spin i{width:22px;height:22px;border-radius:50%;border:3px solid #2c2d33;border-top-color:var(--red);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- testata ---------- */
.top{position:relative;overflow:hidden;color:#fff;padding:max(16px,env(safe-area-inset-top)) 0 70px;background:radial-gradient(90% 120% at 100% 0%,rgba(228,21,25,.24),transparent 55%),var(--blk)}
.top .wrap{position:relative;z-index:1}
.onde{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;z-index:0}
.onde .o1{fill:#22313f;opacity:.6}.onde .o2{fill:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}
.lg{height:28px;width:auto;display:block;flex:none}
.acts-h{display:flex;gap:8px;align-items:center}
.ghost{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid #4a4b52;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;min-height:40px;cursor:pointer;text-decoration:none;white-space:nowrap}
.ghost svg{width:17px;height:17px;flex:none}
.kick{margin:0;color:#b9bac0;font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.kick .pill{background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.kick .pill.gy{background:#2b2c32}
.top h1{margin:6px 0 0;font-size:clamp(28px,6.4vw,46px);line-height:1.05;font-weight:800;text-wrap:balance}
.top .sub{margin:6px 0 0;color:#c4c5cb;font-size:15px}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
.kpi div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-size:clamp(24px,5vw,32px);line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:#b9bac0}
.kpi .r{background:linear-gradient(160deg,rgba(228,21,25,.38),rgba(228,21,25,.12));border-color:rgba(228,21,25,.5)}
.kpi .r span{color:#f1d4d4}
.kpi .ct{background:linear-gradient(160deg,rgba(234,88,12,.4),rgba(234,88,12,.12));border-color:rgba(234,88,12,.55)}
.kpi .ct span{color:#fde1cf}
.pbar{display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .35s}

main.giro{position:relative;z-index:2;margin-top:-40px;padding-bottom:max(48px,env(safe-area-inset-bottom))}

/* ---------- prossima visita ---------- */
.next{position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:20px 20px 18px 26px;box-shadow:var(--sh)}
.next::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--red)}
.next.fine::before{background:var(--ok)}
.next.ct::before{background:#ea580c}
.next.ap::before{background:var(--ok)}
.next .k{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.next .k b{color:#fff;background:var(--red);border-radius:999px;padding:3px 10px}
.next.fine .k b{background:var(--ok)}
.next h2{margin:10px 0 2px;font-size:clamp(22px,5.4vw,30px);line-height:1.12;font-weight:800}
.next .ad{margin:4px 0 0}
.next .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.next .acts .btn{flex:1 1 0;min-height:54px;font-size:16px}
.next .lnk{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:var(--red);text-decoration:none}

/* ---------- giorni ---------- */
nav.days{position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px calc(-1*max(4vw,16px)) 0;padding:10px max(4vw,16px);background:var(--bg);border-bottom:1px solid var(--line)}
nav.days::-webkit-scrollbar{display:none}
nav.days a{flex:none;display:grid;gap:1px;padding:8px 14px;border-radius:14px;background:var(--card);text-decoration:none;line-height:1.2;border:1.5px solid transparent}
nav.days a b{font-size:14px}
nav.days a span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
nav.days a.on{background:var(--ink);color:var(--bg)}
nav.days a.on span{color:var(--bg);opacity:.75}
nav.days a.oggi{border-color:var(--red)}
nav.days a.tutto span{color:var(--ok)}
nav.days a.on.tutto span{color:var(--bg)}

.pre{margin:18px 0 0;border:1px solid var(--line);border-radius:18px;padding:0 18px;background:var(--card)}
.pre summary{cursor:pointer;padding:15px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pre summary::-webkit-details-marker{display:none}
.pre summary::after{content:"+";color:var(--red);font-size:24px;line-height:1}
.pre[open] summary::after{content:"−"}
.pre summary em{font-style:normal;font-weight:600;color:var(--mut);font-size:14px;margin-right:auto;margin-left:6px}
.pre ul{margin:0 0 16px;padding-left:20px}
.pre li{margin:3px 0}

.day{margin-top:26px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:6px 10px 8px;scroll-margin-top:84px}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 10px 10px}
.dh h2{margin:0;font-size:clamp(22px,5vw,28px);line-height:1.1;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.dh h2 small{font-size:16px;font-weight:500;color:var(--mut)}
.dh .route{margin:4px 0 0;color:var(--mut);font-size:14px}
.dh .oggi{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:2px 9px;align-self:center}
.cnt{flex:none;font-size:13px;font-weight:700;color:var(--mut);background:var(--card);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt.tutto{color:#fff;background:var(--ok)}

/* linea del tempo */
ol.stops{list-style:none;margin:0;padding:0}
.st{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:10px 12px;padding:14px 10px 16px;border-radius:16px;transition:background .2s}
.st::before{content:"";position:absolute;left:41px;top:52px;bottom:-14px;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st + .st{margin-top:2px}
.tm{display:grid;justify-items:center;align-content:start;gap:10px}
.st time{font-size:20px;font-weight:800;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
.st time small{display:block;font-size:14px;font-weight:700;color:var(--mut)}
.dot{position:relative;z-index:1;width:16px;height:16px;border-radius:50%;border:3px solid var(--red);background:var(--bg)}
.st h3{margin:0;font-size:18px;line-height:1.25;font-weight:700}
.st.ap:not(.done) .dot{border-color:var(--ok)}
.st.ct:not(.done){background:rgba(234,88,12,.07)}
.st.ct:not(.done) .dot{border-color:#ea580c}
.st.done{background:var(--okbg)}
.st.done h3{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.st.done time{color:var(--ok)}
.st.done .dot{border-color:var(--ok);background:var(--ok)}
.st.done::before{background:var(--ok);opacity:.5}
.st.qui{box-shadow:inset 0 0 0 2px var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.t{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.t.ok{color:var(--ok);background:rgba(29,138,75,.1);border-color:rgba(29,138,75,.25)}
.t.ct{background:#ea580c;border-color:#ea580c;color:#fff}
.t.pz{color:var(--or);background:rgba(194,65,12,.08);border-color:rgba(194,65,12,.25)}
.t.wa{color:var(--wa);background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35)}
.t.pr{background:var(--red);border-color:var(--red);color:#fff}
.t.pa{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ad,.ref,.or{display:flex;gap:7px;align-items:flex-start;margin:6px 0 0;font-size:14px;color:var(--mut)}
.ad svg,.ref svg,.or svg{width:16px;height:16px;flex:none;margin-top:2px}
.ad.nv{color:var(--wa);font-weight:600}
.ref b{color:var(--ink);font-weight:600}
.or{color:var(--ink);font-weight:600}.or svg{color:var(--red)}
.nt{margin:10px 0 0;font-size:14px;white-space:pre-line;border-left:3px solid var(--red);padding:2px 0 2px 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* bottoni */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;transition:filter .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px;flex:none}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 22px rgba(228,21,25,.25)}
.btn.wz{background:#33ccff;border-color:#33ccff;color:#06202e}
.btn.gr{background:#1d8a4b;border-color:#1d8a4b;color:#fff}
.btn.bl{background:#2f5fd0;border-color:#2f5fd0;color:#fff}
.btn.gy{background:var(--card);border-color:var(--line);color:var(--ink)}
.ck{align-self:start;width:44px;height:44px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;position:relative;padding:0}
.ck:hover{border-color:var(--ok)}
.st.done .ck{background:var(--ok);border-color:var(--ok)}
.st.done .ck::after{content:"";position:absolute;left:14px;top:6px;width:10px;height:20px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}

.foot{margin-top:26px;border:1px solid var(--line);border-radius:22px;padding:16px 18px;background:var(--card)}
.foot .btns{display:flex;flex-wrap:wrap;gap:8px}
.foot .btn{background:var(--bg)}
.help{font-size:13px;color:var(--mut);margin:12px 0 0}
#msg{font-size:14px;margin:10px 0 0;color:var(--wa)}
#msg:empty{display:none}
.vuota{color:var(--mut);padding:20px 4px}

/* ---------- archivio (vecchi file con password) ---------- */
.srch{width:100%;margin:0 0 6px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px;box-shadow:var(--sh)}
.gl{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gl button{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 18px;border:0;border-bottom:1px solid var(--line);background:var(--bg);cursor:pointer}
.gl li:last-child button{border-bottom:0}
.gl b{font-size:17px}.gl span{color:var(--mut);font-size:14px}.gl em{font-style:normal;color:var(--red);font-weight:700;grid-row:1/3;grid-column:2;align-self:center}

/* ---------- scheda Naviga ---------- */
#sh{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:min(640px,100%);max-height:92vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:10px max(4vw,18px) max(22px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:su .22s ease-out}
@keyframes su{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet .k{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.sheet .k b{color:#fff;background:var(--red);border-radius:999px;padding:3px 10px}
.sheet h2{margin:10px 0 4px;font-size:clamp(24px,6vw,30px);line-height:1.1;font-weight:800}
.sheet .box{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--card);white-space:pre-line;font-size:16px}
.sheet .box b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:2px}
.sheet .or-b{border-left:4px solid var(--red)}
.sheet .ct-b{border-left:4px solid #ea580c;background:rgba(234,88,12,.1)}
.sheet .act{margin-top:16px}
.sheet .act .go{flex:1 1 0;min-height:58px;font-size:17px}
.sheet .row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:8px}
.sheet .row3 .btn{padding:10px 8px;font-size:14px}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mut);cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--red);flex:none}
.voice.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- finestra Chiama ---------- */
#cw{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.call{background:var(--bg);width:min(380px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:24px 20px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:su .2s ease-out}
.call .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:rgba(29,138,75,.12);color:var(--ok)}
.call .ic svg{width:26px;height:26px}
.call p{margin:0;color:var(--mut);font-size:14px}
.call h2{margin:2px 0 0;font-size:18px;line-height:1.25}
.call .num{display:block;margin:12px 0 14px;font-size:clamp(28px,9vw,36px);font-weight:800;letter-spacing:.02em;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.call .btn{width:100%;margin-top:8px}
.call .go{min-height:56px;font-size:17px}
.call .fi{margin:8px 0 0;font-size:13px;color:var(--mut)}.call .fi button{border:0;background:none;color:var(--red);font:inherit;font-weight:700;cursor:pointer;padding:4px}
.call .nm{display:grid;gap:6px;margin-top:10px;text-align:left}.call .team{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}.call .team .btn{margin-top:0}
.call .nm label{font-size:13px;color:var(--mut)}
.call .ln{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.call small{display:block;margin-top:12px;color:var(--mut);font-size:13px}

#off{position:sticky;top:0;z-index:40;background:#b45309;color:#fff;font-size:14px;font-weight:600;padding:10px max(4vw,14px)}
#stampa{display:none}
@media(max-width:620px){
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ghost .tx{display:none}.ghost{padding:8px 10px}
  .day{padding:4px 4px 6px;border-radius:20px}
  .st{grid-template-columns:52px minmax(0,1fr) 40px;gap:8px 10px;padding:14px 8px 16px}
  .st::before{left:33px}
  .st time{font-size:17px}
  .ck{width:40px;height:40px}.st.done .ck::after{left:12px;top:5px}
  .act .btn{flex:1 1 0;padding:10px 8px}
}
@media(prefers-reduced-motion:reduce){.pbar i,.st{transition:none}.sheet,.call{animation:none}.spin i{animation-duration:2s}}

/* ---------- stampa A4 orizzontale ---------- */
@page{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;color:#000;font-size:10.5pt}
  #app,#sh,#lock,#off,#cw{display:none!important}
  #stampa{display:block}
  #stampa .pg{break-after:page}#stampa .pg:last-child{break-after:auto}
  #stampa .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2pt solid #e41519;padding-bottom:5pt;margin-bottom:8pt}
  #stampa .ph img{height:24pt}#stampa .ph h1{margin:0;font-size:16pt}#stampa .ph p{margin:0;font-size:10pt;color:#444}
  #stampa table{width:100%;border-collapse:collapse;font-size:9.5pt}
  #stampa th{background:#111!important;color:#fff!important;text-align:left;padding:4pt 5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #stampa td{border-bottom:.6pt solid #bbb;padding:5pt;vertical-align:top;white-space:pre-line}
  #stampa tr{break-inside:avoid}

<body>
<div id="lock">
  <form id="lf" autocomplete="off">
    <img src="logo-bianco.png" alt="RAPID Flood Control Systems">
    <h1 class="w" id="lt">Giro commerciale</h1>
    <p id="lh" class="spin"><i aria-hidden="true"></i><span>Apertura del giro…</span></p>
    <input id="pw" type="password" autocomplete="off" aria-label="PIN" hidden>
    <p id="err" role="alert"></p>
    <button id="lb" type="submit" hidden>Apri</button>
  </form>
</div>
<div id="off" hidden>Senza rete: stai usando la copia salvata sul telefono. Chiamate e SMS funzionano; Waze no; Google Maps solo se hai scaricato le mappe offline.</div>
<div id="app" hidden></div>
<div id="sh" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shn" id="shc"></div></div>
<div id="cw" hidden><div class="call" role="dialog" aria-modal="true" aria-labelledby="cwn" id="cwc"></div></div>
<div id="stampa"></div>
<script src="rt.js"></script>
<script>{
const LOGO_B = "logo-bianco.png", LOGO_N = "logo-nero.png";
let TEAM = ["Susannah", "Marco", "Pietro", "Andrea", "Dana"], CTX = null;
// stato della visita: "prospezione" = senza appuntamento, "contattare" = da contattare per appuntamento (arancione), "appuntamento" = fissato (verde)
const ETICHETTE = {"appuntamento":["ok","Appuntamento"],"contattare":["ct","Da contattare per appuntamento"],"priorita":["pr","Priorità"],"partner":["pa","Partner"],"attenzione":["wa","Attenzione"],"senza-appuntamento":["","Senza appuntamento"],"prospezione":["","Senza appuntamento"]};
const ha = (t, e) => (t.etichette || []).includes(e);
// ora dell'appuntamento: precisa («ore 10:30») o fascia («dalle 10:00 alle 12:00»)
const oraTesto = t => !t.ora ? "" : t.ora_a ? "dalle " + t.ora + " alle " + t.ora_a : "ore " + t.ora;
const nomeEt = (t, e) => e === "appuntamento" && t.ora ? "Appuntamento " + oraTesto(t) : ETICHETTE[e] ? ETICHETTE[e][1] : "";
const classeSt = t => ha(t, "appuntamento") ? " ap" : ha(t, "contattare") ? " ct" : "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ss = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const ICO = {
  nav:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4.5 20.3l.7.7L12 18l6.8 3 .7-.7z"/></svg>',
  tel:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
  clk:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16m.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></svg>',
  sms:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2M7 9h10v2H7zm6 5H7v-2h6zm4-6H7V6h10z"/></svg>',
  vox:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4M14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7m0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5"/></svg>',
  usr:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10m0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5"/></svg>',
  prn:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3m-3 11H8v-5h8zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2M18 3H6v4h12z"/></svg>',
  rst:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8"/></svg>',
  edt:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17.2V21h3.8L17.8 9.9l-3.8-3.8zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8z"/></svg>',
  bck:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};
const RAW = { v: 2, id: "" };
const ARCH = false;
const PKEY = "pass-" + RAW.id;
const app = $("#app");
const IN_APP = true;
const ONDE = '<svg class="onde" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true"><path class="o1" d="M0 70 Q150 40 300 70 T600 70 T900 70 T1200 70 V120 H0Z"/><path class="o2" d="M0 88 Q150 62 300 88 T600 88 T900 88 T1200 88 V120 H0Z"/></svg>';

/* ---------- tema chiaro/scuro (stessa scelta del cruscotto: localStorage «rt-tema») ---------- */
const scuroOra = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); };
const temaBtn = () => { const d = scuroOra(); return `<button class="ghost" type="button" id="tema" aria-label="${d ? "Passa al tema chiaro" : "Passa al tema scuro"}">${d ? ICO.sun : ICO.moon}<span class="tx">${d ? "Chiaro" : "Scuro"}</span></button>`; };
document.addEventListener("click", e => { const b = e.target.closest("#tema"); if (!b) return;
  const t = scuroOra() ? "light" : "dark"; document.documentElement.dataset.theme = t; try { localStorage.setItem("rt-tema", t); } catch(x) {}
  b.outerHTML = temaBtn(); });

/* ---------- apertura con PIN / password ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function apri(pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(RAW.salt), iterations:RAW.it, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(RAW.iv)}, key, b64(RAW.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const pw = $("#pw"), lb = $("#lb"), err = $("#err");
if (ARCH){ $("#lt").textContent = "Archivio giri"; $("#lh").textContent = "Inserisci la password dell'archivio."; pw.setAttribute("aria-label","Password"); pw.style.letterSpacing = ".08em"; }
else { pw.inputMode = "numeric"; pw.pattern = "[0-9]*"; pw.maxLength = 12; }
const supporta = !!(window.crypto && crypto.subtle);
if (!supporta){ err.textContent = "Questo browser non può aprire il file protetto. Aprilo con Chrome o Safari aggiornati."; lb.disabled = true; }
async function sblocca(pass, auto){
  lb.disabled = true; err.textContent = ""; lb.textContent = "Apertura…";
  try {
    const D = await apri(pass);
    ss.set(PKEY, pass);
    $("#lock").hidden = true; $("#lock").style.display = "none"; app.hidden = false; pw.value = "";
    if (D.tipo === "archivio") archivio(D); else giro(D, null);
  } catch(e){
    ss.del(PKEY);
    if (!auto) { err.textContent = ARCH ? "Password errata." : "PIN errato."; pw.select(); }
  }
  lb.disabled = !supporta; lb.textContent = "Apri";
}
$("#lf").addEventListener("submit", e => { e.preventDefault(); if (pw.value) sblocca(pw.value, false); });
pw.addEventListener("input", () => { if (!ARCH && /^\d{4}$/.test(pw.value) && RAW.pin === 4) sblocca(pw.value, false); });
function blocca(){
  voce.stop(); ss.del(PKEY); app.innerHTML = ""; $("#stampa").innerHTML = ""; app.hidden = true;
  $("#lock").hidden = false; $("#lock").style.display = ""; document.title = ARCH ? "Archivio giri RAPID" : "Giro commerciale RAPID"; pw.focus();
}

/* ---------- lettura vocale ---------- */
const voce = {
  ok: "speechSynthesis" in window,
  stop(){ try { speechSynthesis.cancel(); } catch(e){} },
  leggi(t, done){
    if (!this.ok) return;
    this.stop();
    const txt = [`${t.azienda}${t.ora ? ", " + oraTesto(t) : ""}.`, ha(t, "contattare") ? "Da contattare per fissare l'appuntamento." : "", t.referente ? `Referente: ${t.referente}.` : "", t.orari ? `Orari: ${t.orari}.` : "", t.note ? `Note: ${t.note}` : "Nessuna nota.", t.portare ? `Da portare: ${t.portare}.` : ""].join(" ");
    try {
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = "it-IT"; u.rate = 1;
      const v = speechSynthesis.getVoices().find(v => /^it/i.test(v.lang)); if (v) u.voice = v;
      u.onend = u.onerror = () => done && done();
      speechSynthesis.speak(u);
    } catch(e){ done && done(); }
  }
};
if (voce.ok) try { speechSynthesis.getVoices(); } catch(e){}

/* ---------- utilità percorso ---------- */
const dest = t => t.indirizzo || t.ricerca || t.azienda;
const mapsDir = arr => { const d = arr[arr.length-1], w = arr.slice(0,-1);
  let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(dest(d));
  if (!w.length && d.place_id) u += "&destination_place_id=" + encodeURIComponent(d.place_id);
  if (w.length) u += "&waypoints=" + encodeURIComponent(w.map(dest).join("|")); return u; };
const wazeUrl = t => "https://waze.com/ul?q=" + encodeURIComponent(dest(t)) + "&navigate=yes";
const telHref = n => "tel:" + String(n).replace(/[^\d+]/g, "");
const telBello = n => { const d = String(n).replace(/[^\d+]/g, ""); return /^3\d{9}$/.test(d) ? d.replace(/^(\d{3})(\d{3})(\d{4})$/, "$1 $2 $3") : String(n).trim(); };
const inClaude = window.self !== window.top;
function chiama(t){
  const cw = $("#cw");
  $("#cwc").innerHTML = `<div class="ic">${ICO.tel}</div><p>Chiama</p><h2 id="cwn">${esc(t.referente ? t.referente + " · " + t.azienda : t.azienda)}</h2>
    <a class="num" href="${esc(telHref(t.telefono))}" target="_top">${esc(telBello(t.telefono))}</a>
    <a class="btn gr go" id="cwg" href="${esc(telHref(t.telefono))}" target="_top">${ICO.tel}Chiama ora</a>
    <a class="btn bl" id="cws" href="#">${ICO.sms}Non risponde: manda SMS</a>
    <p class="fi" id="cwfi" hidden></p>
    <div class="nm" id="cwnm" hidden><label>Chi sei? Il nome va nell'SMS e resta salvato su questo telefono.</label><div class="team">${TEAM.map(n => `<button class="btn gy" type="button" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>
    <div class="ln"><button class="btn gy" type="button" id="cwk">Copia numero</button><button class="btn gy" type="button" id="cwx">Annulla</button></div>
    ${inClaude ? "<small>Se la chiamata non parte, tieni premuto il numero oppure copialo.</small>" : ""}`;
  cw.hidden = false; $("#cwg").focus();
  const num = String(t.telefono).replace(/[^\d+]/g, "");
  const nome = () => ls.get("rt-nome", "");
  const smsHref = () => "sms:" + num + (/iPad|iPhone|iPod|Mac/.test(navigator.userAgent) ? "&" : "?") + "body=" + encodeURIComponent(`Sono ${nome()} della RAPID Antiallagamento, l'ho chiamata ma non ho ricevuto risposta: quando è libero sarebbe così gentile da richiamarmi? Grazie`);
  const cws = $("#cws");
  const prep = () => { const fi = $("#cwfi");
    if (nome()) { cws.href = smsHref(); $("#cwnm").hidden = true; fi.hidden = false; fi.innerHTML = `Firma dell'SMS: <b>${esc(nome())}</b> <button type="button" id="cwch">cambia</button>`;
      $("#cwch").addEventListener("click", () => { fi.hidden = true; $("#cwnm").hidden = false; }); }
    else { cws.removeAttribute("href"); fi.hidden = true; } };
  prep();
  cws.addEventListener("click", e => { if (!nome() || !$("#cwnm").hidden) { e.preventDefault(); $("#cwnm").hidden = false; } });
  $("#cwnm").addEventListener("click", e => { const b = e.target.closest("button[data-n]"); if (!b) return; ls.set("rt-nome", b.dataset.n); prep(); location.href = smsHref(); });
  const chiudi = () => { cw.hidden = true; document.removeEventListener("keydown", k); };
  const k = e => { if (e.key === "Escape") chiudi(); };
  document.addEventListener("keydown", k);
  $("#cwx").addEventListener("click", chiudi);
  cw.onclick = e => { if (e.target === cw) chiudi(); };
  $("#cwk").addEventListener("click", async e => {
    const b = e.currentTarget, num = String(t.telefono).replace(/[^\d+]/g, "");
    try { await navigator.clipboard.writeText(num); b.textContent = "Numero copiato"; }
    catch(x) { b.textContent = "Copia non riuscita: tieni premuto il numero"; }
  });
}
const tags = t => (t.etichette||[]).map(e => ETICHETTE[e] ? `<b class="t ${ETICHETTE[e][0]}">${esc(nomeEt(t, e))}</b>` : "").join("");
const indirizzo = t => t.indirizzo ? `<p class="ad">${ICO.pin}<span>${esc(t.indirizzo)}</span></p>` : `<p class="ad nv">${ICO.pin}<span>Indirizzo da verificare: Maps cerca «${esc(t.ricerca || t.azienda)}»</span></p>`;
const referente = t => t.referente || t.telefono ? `<p class="ref">${ICO.usr}<span>${t.referente ? `<b>${esc(t.referente)}</b>` : ""}${t.referente && t.telefono ? " · " : ""}${t.telefono ? esc(t.telefono) : ""}</span></p>` : "";
const oggiIso = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

/* ---------- vista giro ---------- */
function giro(G, indietro){
  document.title = G.titolo + " · RAPID";
  const K = "spunte-" + G.id; let S = ls.get(K, {});
  const tutte = G.giorni.flatMap((g,i) => g.tappe.map((t,j) => ({t, id:`g${i+1}s${j+1}`, i})));
  const mappa = Object.fromEntries(tutte.map(x => [x.id, x.t]));
  const OGGI = oggiIso(), iOggi = G.giorni.findIndex(g => g.iso === OGGI);
  const nApp = tutte.filter(x => ha(x.t, "appuntamento")).length, nCt = tutte.filter(x => ha(x.t, "contattare")).length;
  const kick = [G.zona ? esc(G.zona) : "", G.archiviato ? '<span class="pill gy">Archiviato</span>' : (iOggi >= 0 ? '<span class="pill">In corso oggi</span>' : "")].filter(Boolean).join("");
  // modifica: chi l'ha creato, gli amministratori e chi lo riceve (condiviso o «Il giro è per»)
  const puoModificare = CTX && (CTX.admin || G.autore === CTX.nome || (G.per || []).includes(CTX.nome) || (G.condiviso || []).includes(CTX.nome));
  app.innerHTML = `
  <header class="top">${ONDE}
    <div class="wrap">
      <div class="row"><img class="lg" src="${LOGO_B}" alt="RAPID"><span class="acts-h">${temaBtn()}${indietro ? `<button class="ghost" id="back">${ICO.bck}<span class="tx">Archivio</span></button>` : (puoModificare ? `<a class="ghost" href="./?modifica=${encodeURIComponent(G.id)}">${ICO.edt}<span class="tx">Modifica</span></a>` : "") + `<a class="ghost" href="./">${ICO.bck}Giri</a>`}${RAW.v === 2 ? "" : '<button class="ghost" id="lk">Blocca</button>'}</span></div>
      <p class="kick">Giro commerciale${kick ? " · " : ""}${kick}</p>
      <h1 class="w">${esc(G.titolo)}</h1>${G.sottotitolo ? `<p class="sub">${esc(G.sottotitolo)}</p>` : ""}
      <div class="kpi">
        <div class="r"><b id="k-f">0/${tutte.length}</b><span>visite fatte</span><span class="pbar"><i id="pb"></i></span></div>
        <div><b id="k-d">${tutte.length}</b><span>da fare</span></div>
        ${nCt ? `<div class="ct"><b>${nCt}</b><span>da contattare</span></div>` : `<div><b>${G.giorni.length}</b><span>${G.giorni.length === 1 ? "giorno" : "giorni"}</span></div>`}
        <div><b>${nApp}</b><span>${nApp === 1 ? "appuntamento" : "appuntamenti"}</span></div>
      </div>
      <span id="pt" hidden></span>
    </div>
  </header>
  <main class="wrap giro">
    ${tutte.length ? '<section class="next" id="nx" aria-live="polite"></section>' : ""}
    ${G.giorni.length > 1 ? `<nav class="days" id="nv" aria-label="Giorni del giro">${G.giorni.map((g,i) => `<a href="#g${i+1}" data-i="${i}"${i === iOggi ? ' class="oggi"' : ""}><b>${esc(g.nome)}${i === iOggi ? " · oggi" : ""}</b><span>${g.data ? esc(g.data) + " · " : ""}<em class="dn"></em></span></a>`).join("")}</nav>` : ""}
    ${(G.prima_di_partire||[]).length ? `<details class="pre"><summary>Prima di partire <em>${G.prima_di_partire.length} ${G.prima_di_partire.length === 1 ? "voce" : "voci"}</em></summary><ul>${G.prima_di_partire.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    ${G.giorni.length ? "" : '<p class="vuota">Nessuna tappa inserita.</p>'}
    ${G.giorni.map((g,i) => `<section class="day" id="g${i+1}">
        <div class="dh"><div>
          <h2>${esc(g.nome)} <small>${esc(g.data||"")}</small>${i === iOggi ? '<span class="oggi">Oggi</span>' : ""}</h2>
          ${[g.percorso, g.notte].filter(Boolean).length ? `<p class="route">${[g.percorso, g.notte].filter(Boolean).map(esc).join(" · ")}</p>` : ""}
        </div><span class="cnt"></span></div>
        <ol class="stops">${g.tappe.map((t,j) => `<li class="st${classeSt(t)}" id="g${i+1}s${j+1}">
          <div class="tm"><time>${esc(t.ora)}${t.ora && t.ora_a ? "<small>–" + esc(t.ora_a) + "</small>" : ""}</time><i class="dot" aria-hidden="true"></i></div>
          <div>
            <h3>${esc(t.azienda)}</h3>
            ${(t.etichette||[]).length ? `<div class="tags">${tags(t)}</div>` : ""}
            ${indirizzo(t)}
            ${referente(t)}
            ${t.orari ? `<p class="or">${ICO.clk}<span>${esc(t.orari)}</span></p>` : ""}
            ${t.note ? `<p class="nt">${esc(t.note)}</p>` : ""}
            <div class="act"><button class="btn red nav" type="button">${ICO.nav}Naviga</button>${t.telefono ? `<button class="btn gr tel" type="button">${ICO.tel}Chiama</button>` : ""}</div>
          </div>
          <button class="ck" type="button" aria-label="Segna ${esc(t.azienda)} come visitata"></button>
        </li>`).join("")}</ol>
      </section>`).join("")}
    <div class="foot">
      <div class="btns"><button class="btn" type="button" id="pr">${ICO.prn}Stampa A4</button><button class="btn" type="button" id="rs">${ICO.rst}Azzera spunte</button></div>
      <p id="msg" role="status"></p>
      <p class="help">«Naviga» apre la scheda della visita, legge le note e da lì si avvia Maps o Waze: la visita diventa verde. Le spunte restano solo su questo telefono. Orari indicativi. In arancione le visite da contattare per fissare l'appuntamento.</p>
    </div>
  </main>`;
  stampa(G);

  /* prossima visita: la prima non fatta (prima quelle di oggi, se il giro è in corso) */
  const prossima = () => {
    const libere = tutte.filter(x => !S[x.id]);
    return libere.find(x => x.i === iOggi) || libere.find(x => iOggi < 0 || x.i >= iOggi) || libere[0] || null;
  };
  const disegnaNext = () => {
    const nx = $("#nx"); if (!nx) return;
    const p = prossima();
    if (!p) { nx.className = "next fine"; nx.innerHTML = `<p class="k"><b>Giro completato</b></p><h2 class="w">Tutte le ${tutte.length} visite sono fatte.</h2><p class="ad">Buon rientro. Per ricominciare da capo usa «Azzera spunte» in fondo alla pagina.</p>`; return; }
    const g = G.giorni[p.i], t = p.t;
    nx.className = "next" + classeSt(t); nx.dataset.id = p.id;
    nx.innerHTML = `<p class="k"><b>Prossima visita</b><span>${esc(g.nome)}${g.data ? " " + esc(g.data) : ""}${t.ora ? " · " + esc(oraTesto(t)) : ""}</span></p>
      <h2>${esc(t.azienda)}</h2>${(t.etichette||[]).length ? `<div class="tags">${tags(t)}</div>` : ""}
      ${indirizzo(t)}${referente(t)}
      <div class="acts"><button class="btn red" type="button" data-a="nav">${ICO.nav}Naviga</button>${t.telefono ? `<button class="btn gr" type="button" data-a="tel">${ICO.tel}Chiama</button>` : ""}</div><a class="lnk" href="#${p.id}">Vedi nella lista ↓</a>`;
  };
  const upd = () => {
    const n = Object.keys(S).filter(k => mappa[k]).length;
    $("#pb").style.width = tutte.length ? (n / tutte.length * 100) + "%" : "0";
    $("#pt").textContent = `${n} di ${tutte.length} visite fatte`;
    $("#k-f").textContent = `${n}/${tutte.length}`; $("#k-d").textContent = tutte.length - n;
    app.querySelectorAll(".day").forEach((d, i) => { const a = d.querySelectorAll(".st").length, f = d.querySelectorAll(".st.done").length, c = d.querySelector(".cnt");
      c.textContent = a ? `${f}/${a} fatte` : "nessuna visita"; c.classList.toggle("tutto", !!a && f === a);
      const pl = app.querySelector(`nav.days a[data-i="${i}"]`); if (pl) { pl.querySelector(".dn").textContent = `${f}/${a}`; pl.classList.toggle("tutto", !!a && f === a); } });
    disegnaNext();
    const p = prossima(); app.querySelectorAll(".st.qui").forEach(li => li.classList.remove("qui")); if (p) { const li = document.getElementById(p.id); if (li) li.classList.add("qui"); }
  };
  const set = (id, v) => { const li = document.getElementById(id); li.classList.toggle("done", v); li.querySelector(".ck").setAttribute("aria-pressed", v); if (v) S[id] = 1; else delete S[id]; ls.set(K, S); upd(); };
  app.querySelectorAll(".st").forEach(li => {
    li.classList.toggle("done", !!S[li.id]); li.querySelector(".ck").setAttribute("aria-pressed", !!S[li.id]);
    li.querySelector(".ck").addEventListener("click", () => set(li.id, !li.classList.contains("done")));
    li.querySelector(".nav").addEventListener("click", () => scheda(mappa[li.id], li.id, set, G));
    const tb = li.querySelector(".tel"); if (tb) tb.addEventListener("click", () => chiama(mappa[li.id]));
  });
  const nx = $("#nx");
  if (nx) nx.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (!b) return; const id = nx.dataset.id, t = mappa[id]; if (!t) return;
    if (b.dataset.a === "nav") scheda(t, id, set, G); else chiama(t); });
  const rs = $("#rs");
  rs.addEventListener("click", () => {
    if (rs.dataset.c){ S = {}; ls.set(K, S); app.querySelectorAll(".st").forEach(li => { li.classList.remove("done"); li.querySelector(".ck").setAttribute("aria-pressed", false); }); upd(); delete rs.dataset.c; rs.innerHTML = ICO.rst + "Azzera spunte"; }
    else { rs.dataset.c = 1; rs.textContent = "Tocca di nuovo per confermare"; }
  });
  $("#pr").addEventListener("click", () => {
    if (window.self !== window.top) { $("#msg").textContent = "Dentro Claude la stampa è bloccata: apri il file .html nel browser (Chrome, Safari, Edge) e premi di nuovo «Stampa A4»."; return; }
    try { window.print(); } catch(e) { $("#msg").textContent = "Stampa non disponibile in questo browser."; }
  });
  if ($("#lk")) $("#lk").addEventListener("click", blocca);
  if (indietro) $("#back").addEventListener("click", () => { voce.stop(); indietro(); scrollTo(0,0); });
  // giorno attivo nelle schede in alto
  const nv = $("#nv"), links = nv ? [...nv.querySelectorAll("a")] : [];
  if ("IntersectionObserver" in window && links.length){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ links.forEach(a => { const on = a.getAttribute("href") === "#" + e.target.id; a.classList.toggle("on", on);
      if (on) nv.scrollTo({ left: a.offsetLeft - (nv.clientWidth - a.offsetWidth) / 2, behavior: "smooth" }); }); } }), {rootMargin:"-90px 0px -60% 0px"});
    app.querySelectorAll(".day").forEach(d => io.observe(d));
  }
  upd();
}

/* ---------- scheda Naviga con lettura delle note ---------- */
function scheda(t, id, set, G){
  const auto = ls.get("voce-auto", true);
  const gi = /^g(\d+)s/.exec(id), g = G && gi ? G.giorni[+gi[1] - 1] : null;
  $("#shc").innerHTML = `<div class="grip" aria-hidden="true"></div>
    <p class="k"><b>${!t.ora ? "Visita" : t.ora_a ? "Visita " + esc(oraTesto(t)) : "Visita delle " + esc(t.ora)}</b>${g ? `<span>${esc(g.nome)}${g.data ? " " + esc(g.data) : ""}</span>` : ""}</p>
    <h2 id="shn">${esc(t.azienda)}</h2>
    ${(t.etichette||[]).length ? `<div class="tags">${tags(t)}</div>` : ""}
    ${ha(t, "contattare") ? '<div class="box ct-b"><b>Da contattare</b>Chiamare per fissare l\'appuntamento.</div>' : ""}
    ${indirizzo(t)}
    ${referente(t)}
    ${t.orari ? `<div class="box or-b"><b>Orari di apertura</b>${esc(t.orari)}</div>` : ""}
    <div class="box"><b>Note</b>${esc(t.note || "Nessuna nota.")}</div>
    ${t.portare ? `<div class="box"><b>Da portare</b>${esc(t.portare)}</div>` : ""}
    <div class="act">
      <a class="btn red go nv-go" id="go" target="_blank" rel="noopener" href="${esc(mapsDir([t]))}">${ICO.nav}Google Maps</a>
      <a class="btn wz go nv-go" id="wz" target="_blank" rel="noopener" href="${esc(wazeUrl(t))}">${ICO.nav}Waze</a>
    </div>
    <div class="row3">
      ${voce.ok ? `<button class="btn bl voice" type="button" id="vx">${ICO.vox}<span>Ascolta note</span></button>` : ""}
      ${t.telefono ? `<button class="btn gr tel" type="button">${ICO.tel}Chiama</button>` : ""}
      <button class="btn gy" type="button" id="cl">Chiudi</button>
    </div>
    ${voce.ok ? `<label class="sw"><input type="checkbox" id="va" ${auto ? "checked" : ""}> Leggi le note in automatico quando premo «Naviga»</label>` : ""}`;
  const sh = $("#sh"); sh.hidden = false; $("#shc").scrollTop = 0;
  const vx = $("#vx");
  const stato = on => { if (!vx) return; vx.classList.toggle("on", on); vx.querySelector("span").textContent = on ? "Ferma lettura" : "Ascolta note"; };
  const parla = () => { stato(true); voce.leggi(t, () => stato(false)); };
  if (vx) vx.addEventListener("click", () => { if (vx.classList.contains("on")) { voce.stop(); stato(false); } else parla(); });
  const va = $("#va"); if (va) va.addEventListener("change", () => ls.set("voce-auto", va.checked));
  const chiudi = () => { voce.stop(); sh.hidden = true; document.removeEventListener("keydown", esc_); const b = document.querySelector(`#${id} .nav`); if (b) b.focus({preventScroll:true}); };
  const esc_ = e => { if (e.key === "Escape") chiudi(); };
  document.addEventListener("keydown", esc_);
  $("#cl").addEventListener("click", chiudi);
  const tb = $("#shc .tel"); if (tb) tb.addEventListener("click", () => chiama(t));
  sh.onclick = e => { if (e.target === sh) chiudi(); };
  $("#shc").querySelectorAll(".nv-go").forEach(a => a.addEventListener("click", () => { set(id, true); setTimeout(() => { sh.hidden = true; }, 300); }));
  $("#go").focus({preventScroll:true});
  if (auto && voce.ok) parla();
}

/* ---------- versione da stampare ---------- */
function stampa(G){
  const head = (g) => `<div class="ph"><div><h1>${esc(G.titolo)}</h1><p>${esc(g ? [g.nome, g.data, g.percorso, g.notte].filter(Boolean).join(" · ") : G.sottotitolo || "")}</p></div><img src="${LOGO_N}" alt="RAPID"></div>`;
  const etS = t => (t.etichette || []).filter(e => ETICHETTE[e]).map(e => `<span class="${e === "contattare" ? "ec" : e === "appuntamento" ? "ea" : ""}">${esc(e === "contattare" ? "DA CONTATTARE per appuntamento" : nomeEt(t, e))}</span>`).join(", ");
  $("#stampa").innerHTML = G.giorni.map((g,i) => `<section class="pg">${head(g)}
    <table><thead><tr><th>Ora</th><th>Azienda</th><th>Indirizzo</th><th>Orari</th><th>Referente / telefono</th><th>Note</th><th>Da portare</th><th>Fatto</th></tr></thead><tbody>
    ${g.tappe.map(t => `<tr class="${classeSt(t).trim()}"><td class="o">${esc(t.ora)}${t.ora && t.ora_a ? "<br>–" + esc(t.ora_a) : ""}</td><td><b>${esc(t.azienda)}</b>${(t.etichette||[]).length ? "<br>" + etS(t) : ""}</td><td>${esc(t.indirizzo || "da verificare: " + (t.ricerca || t.azienda))}</td><td>${esc(t.orari || "")}</td><td>${esc([t.referente, t.telefono].filter(Boolean).join("\n"))}</td><td>${esc(t.note || "")}</td><td>${esc(t.portare || "")}</td><td class="f">☐</td></tr>`).join("")}
    </tbody></table>
    ${i === 0 && (G.prima_di_partire||[]).length ? `<div class="pp"><b>Prima di partire</b><ul>${G.prima_di_partire.map(x => `<li>☐ ${esc(x)}</li>`).join("")}</ul></div>` : ""}
  </section>`).join("");
}

/* ---------- archivio ---------- */
function archivio(A){
  document.title = "Archivio giri · RAPID";
  const giri = [...A.giri].sort((a,b) => String(b.dal||"").localeCompare(String(a.dal||"")));
  const conta = g => g.giorni.reduce((n,d) => n + d.tappe.length, 0);
  app.innerHTML = `
  <header class="top">${ONDE}
    <div class="wrap">
      <div class="row"><img class="lg" src="${LOGO_B}" alt="RAPID"><span class="acts-h">${temaBtn()}<a class="ghost" href="./">${ICO.bck}Giri</a>${RAW.v === 2 ? "" : '<button class="ghost" id="lk">Blocca</button>'}</span></div>
      <p class="kick">Rapid Team</p>
      <h1 class="w">Archivio giri</h1><p class="sub">${giri.length} giri conclusi</p>
    </div>
  </header>
  <main class="wrap giro">
    <input class="srch" id="q" type="search" placeholder="Cerca per giro, azienda o città" aria-label="Cerca nell'archivio">
    <ul class="gl" id="gl"></ul>
    <p class="vuota" id="nr" hidden>Nessun giro trovato.</p>
  </main>`;
  $("#stampa").innerHTML = "";
  const disegna = q => {
    q = q.trim().toLowerCase();
    const vis = giri.map((g,i) => ({g,i})).filter(({g}) => !q || JSON.stringify([g.titolo, g.sottotitolo, g.giorni.map(d => d.tappe.map(t => [t.azienda, t.indirizzo, t.ricerca]))]).toLowerCase().includes(q));
    $("#gl").innerHTML = vis.map(({g,i}) => `<li><button type="button" data-i="${i}"><b>${esc(g.titolo)}</b><span>${esc(g.sottotitolo || "")}${g.sottotitolo ? " · " : ""}${g.giorni.length} giorni · ${conta(g)} visite</span><em>Apri</em></button></li>`).join("");
    $("#gl").hidden = !vis.length; $("#nr").hidden = vis.length > 0;
  };
  disegna("");
  $("#q").addEventListener("input", e => disegna(e.target.value));
  $("#gl").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { giro(giri[+b.dataset.i], () => archivio(A)); scrollTo(0,0); } });
  if ($("#lk")) $("#lk").addEventListener("click", blocca);
}

/* avviso senza rete */
const rete = () => { const o = $("#off"); if (o) o.hidden = navigator.onLine !== false; };
addEventListener("online", rete); addEventListener("offline", rete); rete();
/* aggiornamento automatico: quando si torna sull'app e ogni 15 minuti si controlla se su GitHub c'è una versione nuova (sw.js cambia a ogni rilascio).
   Arrivata la versione nuova la pagina si ricarica da sola; se c'è lavoro non salvato compare la barra «Aggiorna». */
if ("serviceWorker" in navigator && location.protocol === "https:") { try {
  let primo = !navigator.serviceWorker.controller, fatto = false; // primo: la prima volta il cambio è solo l'installazione, non un aggiornamento
  navigator.serviceWorker.register("sw.js").then(reg => {
    const controlla = () => { try { reg.update().catch(() => {}); } catch(e) {} };
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") controlla(); });
    addEventListener("focus", controlla); setInterval(controlla, 15 * 60 * 1000);
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (primo) { primo = false; return; }
    if (fatto) return; fatto = true;
    if ($("#sh").hidden && $("#cw").hidden) { location.reload(); return; }
    const b = document.createElement("div");
    b.setAttribute("role", "status");
    b.style.cssText = "position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;display:flex;gap:12px;align-items:center;max-width:min(560px,94vw);background:#1d8a4b;color:#fff;border-radius:14px;padding:12px 14px;font:600 15px/1.35 Archivo,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)";
    b.innerHTML = '<span>C\'è una nuova versione dell\'app. Salva quello che stai facendo e premi Aggiorna.</span><button type="button" style="flex:none;border:0;border-radius:10px;background:#fff;color:#14532d;font:800 15px Archivo,system-ui,sans-serif;padding:10px 14px;cursor:pointer">Aggiorna</button>';
    b.querySelector("button").onclick = () => { location.reload(); };
    document.body.appendChild(b);
  });
} catch(e) {} }
/* account personali: il giro si apre con l'accesso fatto nella schermata iniziale e si legge da dati/giri.json */
pw.hidden = true; lb.hidden = true;
const vai = (msg) => { $("#lt").textContent = "Rapid Team"; $("#lh").className = ""; $("#lh").textContent = msg; err.textContent = "";
  const a = document.createElement("a"); a.href = "./"; a.textContent = "Vai all'accesso"; a.className = "acc"; $("#lf").appendChild(a); };
const ID = new URLSearchParams(location.search).get("id") || "";
const sess = RT.sess.get();
if (!supporta) vai("Questo browser non può aprire il giro. Usa Chrome o Safari aggiornati.");
else if (!sess || !sess.jwk) vai("Per aprire il giro accedi con il tuo nome e la tua password.");
else (async () => {
  try {
    CTX = await RT.carica(sess);
    TEAM = CTX.utenti.map(u => u.nome);
    const G = (await RT.giri(CTX)).find(g => g.id === ID);
    if (!G) { vai("Questo giro non esiste più oppure non è condiviso con " + sess.nome + "."); return; }
    $("#lock").hidden = true; $("#lock").style.display = "none"; app.hidden = false;
    giro(G, null);
    if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
  } catch(e) { vai("Non è stato possibile aprire il giro: rifai l'accesso."); }
})();
}</script>
