<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0c0d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RAPID Giri">
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icona-180.png">
<title>Giro commerciale RAPID</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: strumento di lavoro, asciutto, da usare in macchina con una mano.
   IDEA: il foglio di marcia di un tecnico RAPID: orari grandi a sinistra, una riga per cliente.
   PICTURE: la lista delle visite stessa, con la barra di avanzamento rossa.
   COLOUR and TYPE: nero e rosso RAPID (#e41519) su bianco; Archivo largo come il logo.
   LAYOUT: una colonna, giorni in schede fisse in alto, azioni grandi sotto ogni visita.
   Template giro commerciale RAPID - generato da build.mjs: i dati sono cifrati (AES-GCM, chiave da PIN/password con PBKDF2).
   Colori senza light-dark() per funzionare anche su telefoni con browser non aggiornati. */
:root{color-scheme:light dark;--bg:#fff;--ink:#111214;--mut:#62646b;--line:#e4e4e7;--card:#f4f4f5;--red:#e41519;--ok:#1d8a4b;--okbg:#e9f6ee;--blk:#0c0c0d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101012;--ink:#f2f2f3;--mut:#a3a4ab;--line:#2a2a2f;--card:#1a1a1e;--okbg:#10271a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#101012;--ink:#f2f2f3;--mut:#a3a4ab;--line:#2a2a2f;--card:#1a1a1e;--okbg:#10271a}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input{font:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wide{font-stretch:125%;font-variation-settings:"wdth" 125}
/* blocco */
#lock{min-height:100vh;min-height:100dvh;background:var(--blk);color:#fff;display:grid;place-items:center;padding:32px 20px}
#lock form{width:min(360px,100%);display:grid;gap:18px;text-align:center}
#lock img{width:min(260px,80%);height:auto;margin:0 auto 10px}
#lock h1{margin:0;font-size:22px;font-weight:700}
#lock p{margin:0;color:#b9bac0;font-size:14px}
#pw{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #3a3a40;background:#18181b;color:#fff;font-size:24px;letter-spacing:.3em;text-align:center}
#pw:focus{border-color:var(--red);outline:0}
#lock button{min-height:52px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px;cursor:pointer}
#lock button:disabled{opacity:.6}
#err{color:#ff8a8a;min-height:21px}
/* intestazione */
.top{background:var(--blk);color:#fff;padding:16px max(5vw,16px) 18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.bar img{height:30px;width:auto}
.ghost{background:transparent;border:1px solid #45454c;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px;cursor:pointer;text-decoration:none}
.top h1{margin:0;font-size:clamp(26px,6vw,40px);line-height:1.05;font-weight:800;text-wrap:balance}
.top .sub{margin:6px 0 0;color:#c4c5cb;font-size:15px}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px;color:#c4c5cb}
.pbar{flex:1;height:8px;border-radius:9px;background:#2b2b31;overflow:hidden;max-width:420px}
.pbar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
nav.days{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px max(5vw,16px);scrollbar-width:none}
nav.days a{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
nav.days a.on{background:var(--ink);color:var(--bg)}
main{max-width:860px;margin:0 auto;padding:0 max(4vw,14px) 48px}
html{scroll-padding-top:64px}
details.pre{margin:18px 0 0;border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.pre summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.pre summary::after{content:"+";color:var(--red);font-size:22px;line-height:1}
details.pre[open] summary::after{content:"−"}
details.pre ul{margin:0 0 14px;padding-left:20px}
/* giorno */
.day h2{margin:34px 0 2px;font-size:28px;line-height:1.1;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.day h2 small{font-size:16px;font-weight:500;color:var(--mut)}
.day h2 .cnt{font-size:13px;font-weight:700;color:var(--ok)}
.day .route{margin:0 0 6px;color:var(--mut);font-size:14px}
ol.stops{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:10px 14px;padding:18px 4px;border-bottom:1px solid var(--line)}
.st time{font-size:22px;font-weight:800;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.st h3{margin:0;font-size:18px;line-height:1.25;font-weight:700}
.st.done{background:var(--okbg)}
.st.done h3{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.st.done time{color:var(--ok)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.t{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card);color:var(--ink)}
.t.ok{background:#d8f1e0;color:#14532d}.t.pr{background:#e41519;color:#fff}.t.pa{background:#111214;color:#fff}.t.wa{background:#ffe3c2;color:#7a3a00}.t.pz{background:#ffedd5;color:#9a3412}
:root[data-theme=dark] .t.pa{background:#f2f2f3;color:#111}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .t.pa{background:#f2f2f3;color:#111}}
.ad,.ref{margin:6px 0 0;font-size:14px;color:var(--mut)}
.ad.nv{color:#b45309}
.or{display:flex;gap:6px;align-items:flex-start;margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ink)}.or svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--red)}
.sheet .or-b{border-left:4px solid var(--red)}
.ref b{color:var(--ink);font-weight:600}
.nt{margin:8px 0 0;font-size:14px;white-space:pre-line;border-left:3px solid var(--red);padding-left:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn svg{width:18px;height:18px;flex:none}
.ck{width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;position:relative;padding:0}
.st.done .ck{background:var(--ok);border-color:var(--ok)}
.st.done .ck::after{content:"";position:absolute;left:12px;top:5px;width:9px;height:18px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px}
.help{font-size:13px;color:var(--mut);margin:16px 0 0}
#msg{font-size:14px;margin:10px 0 0;color:#b45309}
/* archivio */
.srch{width:100%;margin:20px 0 6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.gl{list-style:none;margin:0;padding:0}
.gl button{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.gl b{font-size:18px}.gl span{color:var(--mut);font-size:14px}.gl em{font-style:normal;color:var(--red);font-weight:700;grid-row:1/3;grid-column:2;align-self:center}
/* scheda Naviga */
#sh{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#sh[hidden]{display:none}
.sheet{background:var(--bg);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(4vw,18px) 22px;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet .k{margin:0;color:var(--red);font-weight:700;font-size:14px}
.sheet h2{margin:2px 0 4px;font-size:26px;line-height:1.1;font-weight:800}
.sheet .box{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--card);white-space:pre-line;font-size:16px}
.sheet .box b{display:block;font-size:13px;color:var(--mut);font-weight:600}
.sheet .act .btn{flex:1 1 140px}
.sheet .act .go{flex:1 1 0;min-height:56px;font-size:17px}
.sheet .row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.sheet .row3 .btn{padding:10px 8px;font-size:14px}
.btn.wz{background:#33ccff;border-color:#33ccff;color:#06202e}
.btn.gr{background:#1d8a4b;border-color:#1d8a4b;color:#fff}
.btn.bl{background:#2f5fd0;border-color:#2f5fd0;color:#fff}
.btn.gy{background:var(--card);border-color:var(--line);color:var(--ink)}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--mut);cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--red)}
.voice.on{background:#111214;border-color:#111214;color:#fff}
#cw{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6)}
#cw[hidden]{display:none}
.call{background:var(--bg);width:min(380px,100%);border-radius:20px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.call p{margin:0;color:var(--mut);font-size:15px}
.call h2{margin:2px 0 0;font-size:19px;line-height:1.25}
.call .num{display:block;margin:14px 0 16px;font-size:clamp(28px,9vw,36px);font-weight:800;letter-spacing:.02em;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.call .btn{width:100%;margin-top:8px}
.call .go{min-height:54px;font-size:17px}
.call small{display:block;margin-top:12px;color:var(--mut);font-size:13px}
#stampa{display:none}
@media(max-width:560px){.st{grid-template-columns:54px minmax(0,1fr) 40px;gap:8px 10px}.st time{font-size:18px}.act .btn{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){.pbar i{transition:none}}
/* stampa A4 orizzontale */
@page{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;color:#000;font-size:10.5pt}
  #app,#sh,#lock{display:none!important}
  #stampa{display:block}
  .pg{break-after:page}.pg:last-child{break-after:auto}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2pt solid #e41519;padding-bottom:5pt;margin-bottom:8pt}
  .ph img{height:24pt}.ph h1{margin:0;font-size:16pt}.ph p{margin:0;font-size:10pt;color:#444}
  table{width:100%;border-collapse:collapse;font-size:9.5pt}
  th{background:#111!important;color:#fff!important;text-align:left;padding:4pt 5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{border-bottom:.6pt solid #bbb;padding:5pt;vertical-align:top;white-space:pre-line}
  tr{break-inside:avoid}
  td.o{font-weight:700;white-space:nowrap}td.f{width:34pt}
  .pp{margin:10pt 0 0;font-size:10pt}.pp ul{list-style:none;padding-left:0}.pp li{margin:2pt 0}
}
</style>
</head>

  clk:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16m.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></svg>',
  vox:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4M14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6"/></svg>'
};
const TXT = $("#dati").textContent.trim();
if (TXT.charAt(0) !== "{") { $("#lh").textContent = "Questo è il modello vuoto del programma, senza dati: per vedere un giro apri il suo link o il suo file .html."; $("#pw").hidden = true; $("#lb").hidden = true; throw new Error("modello senza dati"); }
const RAW = JSON.parse(TXT);
const ARCH = RAW.tipo === "archivio";
const PKEY = "pass-" + RAW.id;
const app = $("#app");
const IN_APP = (() => { try { return /\/giri\/[^/]*$/.test(location.pathname); } catch(e) { return false; } })();

/* ---------- apertura con PIN / password ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function apri(pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(RAW.salt), iterations:RAW.it, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(RAW.iv)}, key, b64(RAW.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const pw = $("#pw"), lb = $("#lb"), err = $("#err");
if (ARCH){ $("#lt").textContent = "Archivio giri"; $("#lh").textContent = "Inserisci la password dell'archivio."; pw.setAttribute("aria-label","Password"); pw.style.letterSpacing = ".08em"; }
else { pw.inputMode = "numeric"; pw.pattern = "[0-9]*"; pw.maxLength = 12; }
const supporta = !!(window.crypto && crypto.subtle);
if (!supporta){ err.textContent = "Questo browser non può aprire il file protetto. Aprilo con Chrome o Safari aggiornati."; lb.disabled = true; }
async function sblocca(pass, auto){
  lb.disabled = true; err.textContent = ""; lb.textContent = "Apertura…";
  try {
    const D = await apri(pass);
    ss.set(PKEY, pass);
    $("#lock").hidden = true; $("#lock").style.display = "none"; app.hidden = false; pw.value = "";
    if (D.tipo === "archivio") archivio(D); else giro(D, null);
  } catch(e){
    ss.del(PKEY);
    if (!auto) { err.textContent = ARCH ? "Password errata." : "PIN errato."; pw.select(); }
  }
  lb.disabled = !supporta; lb.textContent = "Apri";
}
$("#lf").addEventListener("submit", e => { e.preventDefault(); if (pw.value) sblocca(pw.value, false); });
pw.addEventListener("input", () => { if (!ARCH && /^\d{4}$/.test(pw.value) && RAW.pin === 4) sblocca(pw.value, false); });
function blocca(){
  voce.stop(); ss.del(PKEY); app.innerHTML = ""; $("#stampa").innerHTML = ""; app.hidden = true;
  $("#lock").hidden = false; $("#lock").style.display = ""; document.title = ARCH ? "Archivio giri RAPID" : "Giro commerciale RAPID"; pw.focus();
}

/* ---------- lettura vocale ---------- */
const voce = {
  ok: "speechSynthesis" in window,
  stop(){ try { speechSynthesis.cancel(); } catch(e){} },
  leggi(t, done){
    if (!this.ok) return;
    this.stop();
    const txt = [`${t.azienda}, ore ${t.ora}.`, t.referente ? `Referente: ${t.referente}.` : "", t.orari ? `Orari: ${t.orari}.` : "", t.note ? `Note: ${t.note}` : "Nessuna nota.", t.portare ? `Da portare: ${t.portare}.` : ""].join(" ");
    try {
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = "it-IT"; u.rate = 1;
      const v = speechSynthesis.getVoices().find(v => /^it/i.test(v.lang)); if (v) u.voice = v;
      u.onend = u.onerror = () => done && done();
      speechSynthesis.speak(u);
    } catch(e){ done && done(); }
  }
};
if (voce.ok) try { speechSynthesis.getVoices(); } catch(e){}

/* ---------- utilità percorso ---------- */
const dest = t => t.indirizzo || t.ricerca || t.azienda;
const mapsDir = arr => { const d = arr[arr.length-1], w = arr.slice(0,-1);
  let u = "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=" + encodeURIComponent(dest(d));
  if (w.length) u += "&waypoints=" + encodeURIComponent(w.map(dest).join("|")); return u; };
const wazeUrl = t => "https://waze.com/ul?q=" + encodeURIComponent(dest(t)) + "&navigate=yes";
const telHref = n => "tel:" + String(n).replace(/[^\d+]/g, "");
const telBello = n => { const d = String(n).replace(/[^\d+]/g, ""); return /^3\d{9}$/.test(d) ? d.replace(/^(\d{3})(\d{3})(\d{4})$/, "$1 $2 $3") : String(n).trim(); };
const inClaude = window.self !== window.top;
function chiama(t){
  const cw = $("#cw");
  $("#cwc").innerHTML = `<p>Chiama</p><h2 id="cwn">${esc(t.referente ? t.referente + " · " + t.azienda : t.azienda)}</h2>
    <a class="num" href="${esc(telHref(t.telefono))}" target="_top">${esc(telBello(t.telefono))}</a>
    <a class="btn red go" id="cwg" href="${esc(telHref(t.telefono))}" target="_top">${ICO.tel}Chiama ora</a>
    <button class="btn" type="button" id="cwk">Copia numero</button>
    <button class="btn" type="button" id="cwx">Annulla</button>
    ${inClaude ? "<small>Se la chiamata non parte, tieni premuto il numero oppure copialo.</small>" : ""}`;
  cw.hidden = false; $("#cwg").focus();
  const chiudi = () => { cw.hidden = true; document.removeEventListener("keydown", k); };
  const k = e => { if (e.key === "Escape") chiudi(); };
  document.addEventListener("keydown", k);
  $("#cwx").addEventListener("click", chiudi);
  cw.onclick = e => { if (e.target === cw) chiudi(); };
  $("#cwk").addEventListener("click", async e => {
    const b = e.currentTarget, num = String(t.telefono).replace(/[^\d+]/g, "");
    try { await navigator.clipboard.writeText(num); b.textContent = "Numero copiato"; }
    catch(x) { b.textContent = "Copia non riuscita: tieni premuto il numero"; }
  });
}
const tags = t => (t.etichette||[]).map(e => ETICHETTE[e] ? `<b class="t ${ETICHETTE[e][0]}">${ETICHETTE[e][1]}</b>` : "").join("");

/* ---------- vista giro ---------- */
function giro(G, indietro){
  document.title = G.titolo + " · RAPID";
  const K = "spunte-" + G.id; let S = ls.get(K, {});
  const tutte = G.giorni.flatMap((g,i) => g.tappe.map((t,j) => ({t, id:`g${i+1}s${j+1}`})));
  const mappa = Object.fromEntries(tutte.map(x => [x.id, x.t]));
  app.innerHTML = `
  <header class="top">
    <div class="bar"><img src="${LOGO_B}" alt="RAPID"><span style="display:flex;gap:8px">${indietro ? '<button class="ghost" id="back">← Archivio</button>' : (IN_APP ? '<a class="ghost" href="../">← Giri</a>' : "")}<button class="ghost" id="lk">Blocca</button></span></div>
    <h1 class="wide">${esc(G.titolo)}</h1>${G.sottotitolo ? `<p class="sub">${esc(G.sottotitolo)}</p>` : ""}
    <div class="prog"><div class="pbar"><i id="pb"></i></div><span id="pt"></span></div>
  </header>
  <nav class="days" id="nv">${G.giorni.map((g,i) => `<a href="#g${i+1}">${esc(g.nome)}${g.data ? " · " + esc(g.data) : ""}</a>`).join("")}</nav>
  <main>
    ${(G.prima_di_partire||[]).length ? `<details class="pre"><summary>Prima di partire</summary><ul>${G.prima_di_partire.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    ${G.giorni.length ? "" : '<p class="help">Nessuna tappa inserita.</p>'}
    ${G.giorni.map((g,i) => {
      return `<section class="day" id="g${i+1}">
        <h2>${esc(g.nome)} <small>${esc(g.data||"")}</small><span class="cnt"></span></h2>
        <p class="route">${[g.percorso, g.notte].filter(Boolean).map(esc).join(" · ")}</p>
        <ol class="stops">${g.tappe.map((t,j) => `<li class="st" id="g${i+1}s${j+1}">
          <time>${esc(t.ora)}</time>
          <div>
            <h3>${esc(t.azienda)}</h3>
            ${(t.etichette||[]).length ? `<div class="tags">${tags(t)}</div>` : ""}
            ${t.indirizzo ? `<p class="ad">${esc(t.indirizzo)}</p>` : `<p class="ad nv">Indirizzo da verificare: Maps cerca «${esc(t.ricerca || t.azienda)}»</p>`}
            ${t.referente || t.telefono ? `<p class="ref">${t.referente ? `<b>${esc(t.referente)}</b>` : ""}${t.referente && t.telefono ? " · " : ""}${t.telefono ? esc(t.telefono) : ""}</p>` : ""}
            ${t.orari ? `<p class="or">${ICO.clk}<span>${esc(t.orari)}</span></p>` : ""}
            ${t.note ? `<p class="nt">${esc(t.note)}</p>` : ""}
            <div class="act"><button class="btn pri nav" type="button">${ICO.nav}Naviga</button>${t.telefono ? `<button class="btn gr tel" type="button">${ICO.tel}Chiama</button>` : ""}</div>
          </div>
          <button class="ck" type="button" aria-label="Segna ${esc(t.azienda)} come visitata"></button>
        </li>`).join("")}</ol>
      </section>`;
    }).join("")}
    <div class="foot">
      <button class="btn" type="button" id="pr">Stampa A4</button>
      <button class="btn" type="button" id="rs">Azzera spunte</button>
    </div>
    <p id="msg" role="status"></p>
    <p class="help">«Naviga» apre la scheda della visita, legge le note e da lì si avvia Maps: la visita diventa verde. Le spunte restano solo su questo telefono. Orari indicativi.</p>
  </main>`;
  stampa(G);

  const upd = () => {
    const n = Object.keys(S).filter(k => mappa[k]).length;
    $("#pb").style.width = tutte.length ? (n / tutte.length * 100) + "%" : "0";
    $("#pt").textContent = `${n} di ${tutte.length} visite fatte`;
    app.querySelectorAll(".day").forEach(d => { const a = d.querySelectorAll(".st").length, f = d.querySelectorAll(".st.done").length; d.querySelector(".cnt").textContent = f ? `${f}/${a} fatte` : ""; });
  };
  const set = (id, v) => { const li = document.getElementById(id); li.classList.toggle("done", v); li.querySelector(".ck").setAttribute("aria-pressed", v); if (v) S[id] = 1; else delete S[id]; ls.set(K, S); upd(); };
  app.querySelectorAll(".st").forEach(li => {
    li.classList.toggle("done", !!S[li.id]); li.querySelector(".ck").setAttribute("aria-pressed", !!S[li.id]);
    li.querySelector(".ck").addEventListener("click", () => set(li.id, !li.classList.contains("done")));
    li.querySelector(".nav").addEventListener("click", () => scheda(mappa[li.id], li.id, set));
    const tb = li.querySelector(".tel"); if (tb) tb.addEventListener("click", () => chiama(mappa[li.id]));
  });
  const rs = $("#rs");
  rs.addEventListener("click", () => {
    if (rs.dataset.c){ S = {}; ls.set(K, S); app.querySelectorAll(".st").forEach(li => { li.classList.remove("done"); li.querySelector(".ck").setAttribute("aria-pressed", false); }); upd(); delete rs.dataset.c; rs.textContent = "Azzera spunte"; }
    else { rs.dataset.c = 1; rs.textContent = "Tocca di nuovo per confermare"; }
  });
  $("#pr").addEventListener("click", () => {
    if (window.self !== window.top) { $("#msg").textContent = "Dentro Claude la stampa è bloccata: apri il file .html nel browser (Chrome, Safari, Edge) e premi di nuovo «Stampa A4»."; return; }
    try { window.print(); } catch(e) { $("#msg").textContent = "Stampa non disponibile in questo browser."; }
  });
  $("#lk").addEventListener("click", blocca);
  if (indietro) $("#back").addEventListener("click", () => { voce.stop(); indietro(); scrollTo(0,0); });
  // giorno attivo nelle schede in alto
  const links = [...app.querySelectorAll("nav.days a")];
  if ("IntersectionObserver" in window && links.length){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); } }), {rootMargin:"-70px 0px -60% 0px"});
    app.querySelectorAll(".day").forEach(d => io.observe(d));
  }
  upd();
}

/* ---------- scheda Naviga con lettura delle note ---------- */
function scheda(t, id, set){
  const auto = ls.get("voce-auto", true);
  $("#shc").innerHTML = `
    <p class="k">Visita delle ${esc(t.ora)}</p>
    <h2 id="shn">${esc(t.azienda)}</h2>
    <p class="ad${t.indirizzo ? "" : " nv"}">${esc(t.indirizzo || "Indirizzo da verificare: Maps cerca «" + (t.ricerca || t.azienda) + "»")}</p>
    ${t.referente || t.telefono ? `<p class="ref">${t.referente ? `<b>${esc(t.referente)}</b>` : ""}${t.referente && t.telefono ? " · " : ""}${t.telefono ? esc(t.telefono) : ""}</p>` : ""}
    ${t.orari ? `<div class="box or-b"><b>Orari di apertura</b>${esc(t.orari)}</div>` : ""}
    <div class="box"><b>Note</b>${esc(t.note || "Nessuna nota.")}</div>
    ${t.portare ? `<div class="box"><b>Da portare</b>${esc(t.portare)}</div>` : ""}
    <div class="act">
      <a class="btn red go nv-go" id="go" target="_blank" rel="noopener" href="${esc(mapsDir([t]))}">${ICO.nav}Google Maps</a>
      <a class="btn wz go nv-go" id="wz" target="_blank" rel="noopener" href="${esc(wazeUrl(t))}">${ICO.nav}Waze</a>
    </div>
    <div class="act row3">
      ${voce.ok ? `<button class="btn bl voice" type="button" id="vx">${ICO.vox}<span>Ascolta note</span></button>` : ""}
      ${t.telefono ? `<button class="btn gr tel" type="button">${ICO.tel}Chiama</button>` : ""}
      <button class="btn gy" type="button" id="cl">Chiudi</button>
    </div>
    ${voce.ok ? `<label class="sw"><input type="checkbox" id="va" ${auto ? "checked" : ""}> Leggi le note in automatico quando premo «Naviga»</label>` : ""}`;
  const sh = $("#sh"); sh.hidden = false;
  const vx = $("#vx");
  const stato = on => { if (!vx) return; vx.classList.toggle("on", on); vx.querySelector("span").textContent = on ? "Ferma lettura" : "Ascolta note"; };
  const parla = () => { stato(true); voce.leggi(t, () => stato(false)); };
  if (vx) vx.addEventListener("click", () => { if (vx.classList.contains("on")) { voce.stop(); stato(false); } else parla(); });
  const va = $("#va"); if (va) va.addEventListener("change", () => ls.set("voce-auto", va.checked));
  const chiudi = () => { voce.stop(); sh.hidden = true; document.removeEventListener("keydown", esc_); const b = document.querySelector(`#${id} .nav`); if (b) b.focus(); };
  const esc_ = e => { if (e.key === "Escape") chiudi(); };
  document.addEventListener("keydown", esc_);
  $("#cl").addEventListener("click", chiudi);
  const tb = $("#shc .tel"); if (tb) tb.addEventListener("click", () => chiama(t));
  sh.onclick = e => { if (e.target === sh) chiudi(); };
  $("#shc").querySelectorAll(".nv-go").forEach(a => a.addEventListener("click", () => { set(id, true); setTimeout(() => { sh.hidden = true; }, 300); }));
  $("#go").focus();
  if (auto && voce.ok) parla();
}

/* ---------- versione da stampare ---------- */
function stampa(G){
  const head = (g) => `<div class="ph"><div><h1>${esc(G.titolo)}</h1><p>${esc(g ? [g.nome, g.data, g.percorso, g.notte].filter(Boolean).join(" · ") : G.sottotitolo || "")}</p></div><img src="${LOGO_N}" alt="RAPID"></div>`;
  $("#stampa").innerHTML = G.giorni.map((g,i) => `<section class="pg">${head(g)}
    <table><thead><tr><th>Ora</th><th>Azienda</th><th>Indirizzo</th><th>Orari</th><th>Referente / telefono</th><th>Note</th><th>Da portare</th><th>Fatto</th></tr></thead><tbody>
    ${g.tappe.map(t => `<tr><td class="o">${esc(t.ora)}</td><td><b>${esc(t.azienda)}</b>${(t.etichette||[]).length ? "<br>" + (t.etichette.map(e => ETICHETTE[e] ? ETICHETTE[e][1] : "").filter(Boolean).map(esc).join(", ")) : ""}</td><td>${esc(t.indirizzo || "da verificare: " + (t.ricerca || t.azienda))}</td><td>${esc(t.orari || "")}</td><td>${esc([t.referente, t.telefono].filter(Boolean).join("\n"))}</td><td>${esc(t.note || "")}</td><td>${esc(t.portare || "")}</td><td class="f">☐</td></tr>`).join("")}
    </tbody></table>
    ${i === 0 && (G.prima_di_partire||[]).length ? `<div class="pp"><b>Prima di partire</b><ul>${G.prima_di_partire.map(x => `<li>☐ ${esc(x)}</li>`).join("")}</ul></div>` : ""}
  </section>`).join("");
}

/* ---------- archivio ---------- */
function archivio(A){
  document.title = "Archivio giri · RAPID";
  const giri = [...A.giri].sort((a,b) => String(b.dal||"").localeCompare(String(a.dal||"")));
  const conta = g => g.giorni.reduce((n,d) => n + d.tappe.length, 0);
  app.innerHTML = `
  <header class="top">
    <div class="bar"><img src="${LOGO_B}" alt="RAPID"><span style="display:flex;gap:8px">${IN_APP ? '<a class="ghost" href="../">← Giri</a>' : ""}<button class="ghost" id="lk">Blocca</button></span></div>
    <h1 class="wide">Archivio giri</h1><p class="sub">${giri.length} giri conclusi</p>
  </header>
  <main>
    <input class="srch" id="q" type="search" placeholder="Cerca per giro, azienda o città" aria-label="Cerca nell'archivio">
    <ul class="gl" id="gl"></ul>
    <p class="help" id="nr" hidden>Nessun giro trovato.</p>
  </main>`;
  $("#stampa").innerHTML = "";
  const disegna = q => {
    q = q.trim().toLowerCase();
    const vis = giri.map((g,i) => ({g,i})).filter(({g}) => !q || JSON.stringify([g.titolo, g.sottotitolo, g.giorni.map(d => d.tappe.map(t => [t.azienda, t.indirizzo, t.ricerca]))]).toLowerCase().includes(q));
    $("#gl").innerHTML = vis.map(({g,i}) => `<li><button type="button" data-i="${i}"><b>${esc(g.titolo)}</b><span>${esc(g.sottotitolo || "")}${g.sottotitolo ? " · " : ""}${g.giorni.length} giorni · ${conta(g)} visite</span><em>Apri</em></button></li>`).join("");
    $("#nr").hidden = vis.length > 0;
  };
  disegna("");
  $("#q").addEventListener("input", e => disegna(e.target.value));
  $("#gl").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { giro(giri[+b.dataset.i], () => archivio(A)); scrollTo(0,0); } });
  $("#lk").addEventListener("click", blocca);
}

/* riapertura automatica nella stessa sessione del browser */
const salvata = ss.get(PKEY);
if (salvata && supporta) sblocca(salvata, true); else pw.focus();
}</script>
</body>
